name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/parcel/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/parcel/manifest.json
          sed -i "s/^VERSION: Final = \".*\"/VERSION: Final = \"$VERSION\"/" custom_components/parcel/const.py
          sed -i "s/^var PARCEL_CARD_VERSION = '.*';/var PARCEL_CARD_VERSION = '$VERSION';/" custom_components/parcel/frontend/parcel-card.js

      - name: Build zip
        run: cd custom_components/parcel && zip -r ../../parcel.zip .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: parcel.zip
