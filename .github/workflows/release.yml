name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version custom_components/parcel/manifest.json)" = "$TAG"
          grep -q "VERSION: Final = \"$TAG\"" custom_components/parcel/const.py
          grep -q "PARCEL_CARD_VERSION = '$TAG'" custom_components/parcel/frontend/parcel-card.js

      - name: Build zip
        run: cd custom_components/parcel && zip -r ../../parcel.zip . -x "__pycache__/*"

      - name: Publish release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: parcel.zip
          generate_release_notes: true
