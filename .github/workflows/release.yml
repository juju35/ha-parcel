name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        run: cd custom_components/parcel && zip -r ../../parcel.zip .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: parcel.zip
